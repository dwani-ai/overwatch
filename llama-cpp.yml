services:
  overwatch-vlm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: overwatch-vlm
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --model /models/gemma4-e2b/gemma-4-E2B-it-Q4_K_M.gguf
      --mmproj /models/gemma4-e2b/mmproj-BF16.gguf
      --host 0.0.0.0
      --port 9000
      --ctx-size 32768
      --n-gpu-layers 99
      --jinja
      --alias gemma4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s